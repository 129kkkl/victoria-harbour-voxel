<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#183538" />
  <meta name="description" content="探索维多利亚港：九种程序化建筑语汇、昼夜光影、海港渡轮与城市巡游。" />
  <title>维多利亚港 · 城市图景</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #06080c; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    #loading {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 38%, #284c4c, #11292e 65%); color: #e9eddf;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      transition: opacity 0.6s ease;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading h1 { font-size: 22px; font-weight: 500; letter-spacing: 4px; margin: 0 0 6px; }
    #loading .sub { font-size: 12px; color: #6f8296; letter-spacing: 2px; margin-bottom: 28px; }
    #loading .bar-wrap { width: 320px; height: 4px; background: #1a2430; border-radius: 2px; overflow: hidden; }
    #loading .bar { height: 100%; width: 0%; background: linear-gradient(90deg, #698f83, #dce5c3); transition: width 0.15s ease; }
    #loading .step { margin-top: 12px; font-size: 12px; color: #89a2bd; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="loading">
    <h1>维多利亚港</h1>
    <div class="sub">VICTORIA HARBOUR · AN URBAN PORTRAIT</div>
    <div class="bar-wrap"><div class="bar" id="loading-bar"></div></div>
    <div class="step" id="loading-step">初始化…</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
